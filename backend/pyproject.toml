[project]
name = "goal-together-backend"
version = "0.1.0"
description = "FastAPI backend for Goal Together todo app"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.1.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
