openapi: 3.0.3
info:
  title: Todo App API
  version: 1.0.0
  description: API contract for bounded todo management and current-state progress summary.
servers:
  - url: http://localhost:8000
paths:
  /todos:
    get:
      summary: List todos
      responses:
        "200":
          description: Todo list response
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TodoItem"
    post:
      summary: Create todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Todo cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /todos/{todoId}:
    patch:
      summary: Update todo target and/or completion state
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete todo
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /todos/{todoId}/toggle:
    post:
      summary: Toggle completion state
      parameters:
        - in: path
          name: todoId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /progress:
    get:
      summary: Get current list progress summary
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
components:
  schemas:
    TodoItem:
      type: object
      required: [id, main_target, is_completed, created_at, updated_at]
      properties:
        id:
          type: string
        main_target:
          type: string
          minLength: 1
          maxLength: 200
        is_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTodoRequest:
      type: object
      required: [main_target]
      properties:
        main_target:
          type: string
          minLength: 1
          maxLength: 200
    UpdateTodoRequest:
      type: object
      properties:
        main_target:
          type: string
          minLength: 1
          maxLength: 200
        is_completed:
          type: boolean
      additionalProperties: false
    ProgressSummary:
      type: object
      required: [total_count, completed_count, percentage, label]
      properties:
        total_count:
          type: integer
          minimum: 0
          maximum: 5
        completed_count:
          type: integer
          minimum: 0
          maximum: 5
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        label:
          type: string
          example: 0/0
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
